spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://postgres:5432/cognivault}
    username: ${DATABASE_USERNAME:cognivault}
    password: ${DATABASE_PASSWORD:cognivault_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  h2:
    console:
      enabled: false

jwt:
  secret: ${JWT_SECRET:prod_jwt_super_secret_key_minimum_256_bits_length_for_hmac_sha}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}


cognivault:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost,http://localhost:80}
  document:
    upload-dir: ${UPLOAD_DIR:/app/uploads}
  embedding:
    provider: ${EMBEDDING_PROVIDER:gemini}
    model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
    dimension: 1536
  rag:
    provider: ${RAG_PROVIDER:gemini}
    model: ${GEMINI_CHAT_MODEL:gemini-2.5-flash}
    top-k: 5
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.05}
    max-context-chars: 12000
  migration:
    reembed-existing: ${MIGRATE_EXISTING_EMBEDDINGS:false}

logging:
  level:
    root: INFO
    com.example.aiknowledgeassistant: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
