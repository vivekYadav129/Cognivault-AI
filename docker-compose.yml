version: '3.8'

services:
  # ============================================================
  # 1. PostgreSQL Database with pgvector Extension
  # ============================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cognivault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cognivault}
      POSTGRES_USER: ${POSTGRES_USER:-cognivault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cognivault_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cognivault} -d ${POSTGRES_DB:-cognivault}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cognivault-network

  # ============================================================
  # 2. Spring Boot 3 Backend Service
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cognivault-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cognivault}
      DATABASE_USERNAME: ${POSTGRES_USER:-cognivault}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-cognivault_password}
      JWT_SECRET: ${JWT_SECRET:-9a4f2c8d7e1b5a9c3d7e1f4a8c2b5e9f1a4c7d0e3f6a9c2b5e8f1a4c7d0e3f6a}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      RAG_SIMILARITY_THRESHOLD: ${RAG_SIMILARITY_THRESHOLD:-0.30}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1:5173}
      UPLOAD_DIR: /app/uploads
    ports:
      - "8080:8080"
    volumes:
      - document_uploads:/app/uploads
    networks:
      - cognivault-network

  # ============================================================
  # 3. React + Nginx Frontend Service
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cognivault-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "5173:80"
    networks:
      - cognivault-network

# ============================================================
# Persistent Storage Volumes & Networks
# ============================================================
volumes:
  postgres_data:
    name: cognivault-postgres-data
  document_uploads:
    name: cognivault-document-uploads

networks:
  cognivault-network:
    name: cognivault-network
    driver: bridge
